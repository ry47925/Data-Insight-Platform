# ============================================================
# Data Insight Platform - Docker Compose 模板
# ============================================================
# 使用方式：
#   1. 复制本文件为 docker-compose.yml：  copy docker-compose.example.yml docker-compose.yml
#   2.（可选）在项目根目录创建 .env，按需覆盖下方 ${VAR:-默认值} 中的默认密码/密钥
#   3. 启动：
#        开发模式（热更新，推荐）：  docker-compose --profile dev up -d --build
#        生产模式（构建镜像）：       docker-compose --profile prod up -d --build
#      （Windows 可直接运行一键脚本： .\start.ps1）
#
# 模式说明：
#   - 基础设施（postgres/redis/clickhouse/minio/celery-worker）无 profile，始终启动
#   - dev：后端 uvicorn --reload + 前端 Vite HMR（改代码即时生效，本地无需 Python/Node）
#   - prod：后端多 worker + 前端 Nginx 静态托管（需重新 build 生效）
#
# 安全提示：
#   - 所有敏感项均通过 ${VAR:-默认值} 形式提供，默认值仅用于本地开发快速启动
#   - 生产环境务必通过根目录 .env 设置强密码，切勿使用默认值
#   - backend/.env 提供容器内运行配置（数据库连接、API Key 等），已由 .gitignore 排除
# ============================================================

version: "3.8"

services:
  # ==================== 基础设施（始终启动）====================

  # ---------- Redis 缓存服务 ----------
  redis:
    image: redis:7-alpine
    container_name: data-insight-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123456}
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    networks:
      - data-insight-network
    restart: unless-stopped

  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:17-alpine
    container_name: data-insight-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-datainsight}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-datainsight123}
      - POSTGRES_DB=data_insight
      # 自动清理长时间占用事务的连接,防止连接泄漏导致系统卡死
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5433:5432"  # 映射到 5433 避免与本地 PostgreSQL 冲突
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - data-insight-network
    restart: unless-stopped
    command: >
      postgres
      -c idle_in_transaction_session_timeout=60000
      -c statement_timeout=300000

  # ---------- ClickHouse 分析引擎 ----------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: data-insight-clickhouse
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse123456}
      - CLICKHOUSE_DB=analysis
    ports:
      - "8123:8123"
      - "9004:9000"
    volumes:
      # 命名卷：绑定挂载到 Windows 文件系统时 ClickHouse 的目录 rename 会 Permission denied（错误码 1001）
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - data-insight-network
    restart: unless-stopped

  # ---------- MinIO 对象存储 ----------
  minio:
    image: minio/minio:latest
    container_name: data-insight-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker-data/minio:/data
    networks:
      - data-insight-network
    restart: unless-stopped

  # ---------- Celery Worker（异步任务，dev/prod 共用）----------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data-insight-celery
    command: >
      celery -A app.services.task_manager worker --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
      --time-limit=${CELERY_TASK_TIME_LIMIT:-1800}
      --soft-time-limit=${CELERY_TASK_SOFT_TIME_LIMIT:-1500}
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123456}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123456}@redis:6379/2
      - DATABASE_URL=postgresql://${POSTGRES_USER:-datainsight}:${POSTGRES_PASSWORD:-datainsight123}@postgres:5432/data_insight
      - ASYNC_THRESHOLD=${ASYNC_THRESHOLD:-10000}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - CELERY_TASK_TIME_LIMIT=${CELERY_TASK_TIME_LIMIT:-1800}
      - CELERY_TASK_SOFT_TIME_LIMIT=${CELERY_TASK_SOFT_TIME_LIMIT:-1500}
      - CELERY_WORKER_PREFETCH_MULTIPLIER=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      - MAX_RUNNING_PER_USER=${MAX_RUNNING_PER_USER:-2}
      - MAX_PENDING_PER_USER=${MAX_PENDING_PER_USER:-10}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=data-insight
      - MINIO_SECURE=false
      - CLICKHOUSE_ENABLED=true
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse123456}
      - CLICKHOUSE_DATABASE=analysis
    depends_on:
      - redis
      - postgres
      - minio
    volumes:
      - ./backend/app:/app/app
      - ./backend/.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - data-insight-network
    restart: unless-stopped

  # ==================== 开发模式（docker-compose --profile dev up）====================

  # ---------- 后端（uvicorn --reload，源码挂载热更新）----------
  backend:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data-insight-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-datainsight}:${POSTGRES_PASSWORD:-datainsight123}@postgres:5432/data_insight
      - REDIS_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123456}@redis:6379/0
      - CELERY_ENABLED=true
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123456}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123456}@redis:6379/2
      - CLICKHOUSE_ENABLED=true
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse123456}
      - CLICKHOUSE_DATABASE=analysis
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=data-insight
      - MINIO_SECURE=false
    volumes:
      - ./backend/app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - postgres
      - minio
    networks:
      - data-insight-network
    restart: unless-stopped

  # ---------- 前端（Node 容器跑 Vite，用户端 5173 / 管理端 5174，HMR 热更新）----------
  frontend:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: data-insight-frontend
    working_dir: /app
    command: sh -c "npm install && (npm run dev -- --host 0.0.0.0 & npm run dev:admin -- --host 0.0.0.0 & wait)"
    ports:
      - "5173:5173"
      - "5174:5174"
    volumes:
      - ./frontend:/app
      # node_modules 用命名卷隔离，避免宿主目录覆盖容器内依赖
      - node_modules:/app/node_modules
    networks:
      - data-insight-network
    restart: unless-stopped

  # ==================== 生产模式（docker-compose --profile prod up）====================

  # ---------- 后端（多 worker，无热重载）----------
  backend-prod:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data-insight-backend-prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --limit-concurrency 100 --timeout-keep-alive 30
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-datainsight}:${POSTGRES_PASSWORD:-datainsight123}@postgres:5432/data_insight
      - REDIS_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123456}@redis:6379/0
      - CELERY_ENABLED=true
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123456}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123456}@redis:6379/2
      - CLICKHOUSE_ENABLED=true
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse123456}
      - CLICKHOUSE_DATABASE=analysis
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=data-insight
      - MINIO_SECURE=false
    depends_on:
      - redis
      - postgres
      - minio
    networks:
      - data-insight-network
    restart: unless-stopped

  # ---------- 前端（Nginx 静态托管构建产物）----------
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE: /
    container_name: data-insight-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend-prod
    networks:
      - data-insight-network
    restart: unless-stopped

# ==================== 数据卷 ====================
volumes:
  # ClickHouse 数据卷（命名卷，Docker VM 内部 Linux 文件系统管理）
  clickhouse-data:
  # 前端 node_modules 卷（开发模式复用依赖）
  node_modules:

# ==================== 网络 ====================
networks:
  data-insight-network:
    driver: bridge
